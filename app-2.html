<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TrackOven — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#081029;--navy2:#0E1A3F;--black:#04070F;--gold:#E8B94A;--gold2:#F6D77E;--ink:#fff;--mute:#A9B2CC;--line:rgba(255,255,255,.12);--up:#34D399;--down:#F87171;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:'Sora',system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--navy2),var(--navy) 40%,var(--black));background-color:var(--navy);line-height:1.5}
button,input,select{font:inherit}
.w{max-width:720px;margin:0 auto;padding:16px 16px 70px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.logo{display:flex;gap:8px;align-items:center;font-weight:800;font-size:19px}
.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.logo .i{color:var(--gold)}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--black);display:grid;place-items:center;font-weight:800;font-size:13px}
.card{background:rgba(14,26,63,.7);border:1px solid var(--line);border-radius:24px;padding:20px;margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:16px}
.wel{border-color:rgba(232,185,74,.45)}
.wel b{display:block;font-size:20px;letter-spacing:-.02em;margin-bottom:4px}
.wel span{color:var(--mute);font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.chip{border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:99px;padding:8px 15px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--gold);color:var(--black);border-color:var(--gold)}
.sub{font-size:12px;color:var(--mute)}
.cd{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;text-align:center;margin:10px 0}
.cd div{background:var(--black);border:1px solid var(--line);border-radius:14px;padding:10px 0}
.cd b{display:block;font-size:22px;font-variant-numeric:tabular-nums;color:var(--gold)}
.cd span{font-size:10px;color:var(--mute)}
.row{display:flex;gap:8px;flex-wrap:wrap}
select,input{background:var(--black);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
select:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
label{display:grid;gap:4px;font-size:12px;color:var(--mute);font-weight:600;flex:1;min-width:130px}
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#04070F}
.btn:active{transform:scale(.97)}
.btn.o{background:transparent;color:var(--ink);border:1px solid var(--line)}
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{position:relative;width:140px;height:140px}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.big{font-size:38px;font-weight:800;letter-spacing:-.04em;line-height:1}
.pill{display:inline-block;font-weight:700;font-size:13px;padding:3px 10px;border-radius:99px;background:var(--line)}
.pill.up{background:rgba(52,211,153,.15);color:var(--up)}.pill.down{background:rgba(248,113,113,.15);color:var(--down)}
.rows{display:grid;gap:6px;margin-top:10px;font-size:13px}
.rows div{display:flex;justify-content:space-between}
.sbar{display:grid;grid-template-columns:104px 1fr auto;gap:10px;align-items:center;margin:11px 0;font-size:13px}
.track{height:8px;background:var(--line);border-radius:9px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:9px;transition:width .7s}
.hist{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.hist small{display:block;color:var(--mute)}
.x{background:none;border:0;color:var(--mute);cursor:pointer;padding:4px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--mute);font-size:11px;font-family:inherit}
.lock{display:flex;align-items:center;gap:12px;padding:12px;border:1px dashed var(--line);border-radius:16px;margin-bottom:8px;color:var(--mute);font-size:13px}
.lock .i{color:var(--gold)}
.lock b{display:block;color:var(--ink);font-size:14px}
.er{color:var(--down);font-size:12px;min-height:16px;margin:6px 0}
.badge{font-size:10px;background:var(--gold);color:var(--black);border-radius:99px;padding:2px 8px;font-weight:800;margin-left:6px}
@media(max-width:480px){.hero{grid-template-columns:1fr;justify-items:center}.hero>div:last-child{width:100%}.cd b{font-size:18px}.sbar{grid-template-columns:84px 1fr auto}}
.tgb{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--gold);cursor:pointer;display:grid;place-items:center}.tgb svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.hr{display:flex;gap:10px;align-items:center}
.res{margin-top:12px;padding:14px;border:1px solid var(--gold);border-radius:18px}.res .big{font-size:34px;color:var(--gold)}
:root[data-theme="light"]{--navy:#F3F5FB;--navy2:#E4E9F7;--black:#fff;--ink:#0B1330;--mute:#55607F;--line:rgba(11,19,48,.15);--up:#0E9F6E;--down:#D9362F;--gold:#B7860F;--gold2:#E6BE55}
:root[data-theme="light"] .card{background:rgba(255,255,255,.88)}
.tmd{font-size:54px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;color:var(--gold);margin:14px 0;letter-spacing:-.03em}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.g3>div{border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;background:var(--black)}.g3 b{display:block;font-size:24px;color:var(--gold)}
.ck{display:flex;gap:10px;align-items:flex-start;flex:1;font-size:14px;color:var(--ink);font-weight:500}.ck input{width:20px;height:20px;margin-top:2px;accent-color:var(--gold);flex:none}.ck small{display:block;color:var(--mute);font-size:12px}.ck .ok{color:var(--up)}
.dh{font-size:12px;font-weight:700;color:var(--gold);margin:14px 0 2px}.tb{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.sm{padding:8px 14px;font-size:13px}
@media print{body{background:#fff!important}.w>*{display:none!important}body[data-pr="tt"] #tt,body[data-pr="rp"] #rp,body[data-pr="sr"] #sr{display:block!important}.nop{display:none!important}body[data-pr] .w *{color:#000!important;background:none!important;border-color:#999!important}}
.ov{position:fixed;inset:0;z-index:20;background:rgba(2,5,14,.82);display:none;overflow-y:auto;padding:max(20px,env(safe-area-inset-top,0px)) 16px 24px}.ov.on{display:block}
.pl{border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;background:var(--black);width:100%;text-align:left;color:var(--ink)}.pl.on{border-color:var(--gold)}.pl b{font-size:18px;color:var(--gold)}
</style>
<script>try{var t=localStorage.getItem("to-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}
const PLANS=[{n:'Monthly',p:1500,d:30},{n:'3 Months',p:4000,d:90},{n:'Yearly',p:12000,d:365}];let selPlan=1,upMsg='';
function up(){let o=$('upm');if(!o){o=document.createElement('div');o.className='ov';o.id='upm';document.body.appendChild(o)}
 const pr=FEATS.filter(f=>!f.free);
 o.innerHTML=`<div class="card" style="max-width:440px;margin:20px auto;position:relative"><button class="x" id="upx" aria-label="Close" style="position:absolute;top:12px;right:14px">${ic('x')}</button><h3 style="font-size:20px">Upgrade to Premium</h3><div class="sub" style="margin-bottom:12px">Unlock:</div>${pr.map(f=>`<div style="display:flex;gap:8px;align-items:center;font-size:14px;margin:6px 0"><span style="color:var(--gold)">${ic('check')}</span>${f.n}</div>`).join('')||'<div class="sub">Everything is already free right now.</div>'}<div style="margin-top:14px">${PLANS.map((p,i)=>`<button class="pl ${i===selPlan?'on':''}" data-pl="${i}"><span>${p.n}<span class="sub" style="display:block">${p.d} days</span></span><b>₦${p.p.toLocaleString()}</b></button>`).join('')}</div><button class="btn" id="upg" style="width:100%">Pay ₦${PLANS[selPlan].p.toLocaleString()} with Paystack</button><div class="er ${upMsg?'ok':''}" style="margin-top:10px">${upMsg}</div><div class="sub">Prices shown are samples. You set the real plans in the admin dashboard. Premium unlocks automatically once Paystack confirms the payment.</div></div>`;
 if(!(history.state&&history.state.m))history.pushState({m:1},'');o.classList.add('on');$('upx').onclick=()=>{if(history.state&&history.state.m)history.back();else{o.classList.remove('on');upMsg=''}};
 o.querySelectorAll('[data-pl]').forEach(b=>b.onclick=()=>{selPlan=+b.dataset.pl;upMsg='';up()});
 $('upg').onclick=()=>{upMsg='Online payment is being connected. Please check back soon.';up()}}
</script>
<style>html{visibility:hidden}.lo{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:99px;padding:6px 12px;font-size:12px;cursor:pointer}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>requireStudent().then(function(s){if(s)document.documentElement.style.visibility="visible"})</script>
</head>
<body>
<div class="w">
<header><div class="logo" id="logo"></div><div class="hr"><button class="tgb" id="th"></button><button class="lo" id="lo" onclick="doLogout()">Log out</button></div></header>

<section class="card wel"><b id="wt"></b><span id="wm"></span></section>

<div id="ina"></div>
<div class="chips" id="chips"></div>

<div id="cdlock"></div>
<section class="card" id="cdsec">
  <h3>Exam countdown</h3>
  <div class="row">
    <label>Choose exam<select id="cs"></select></label>
  </div>
  <div id="cust" class="row" style="display:none;margin-top:10px">
    <label>Exam name<input id="cn" placeholder="e.g. Departmental test"></label>
    <label>Date and time<input id="cdt" type="datetime-local"></label>
    <button class="btn" id="csave" style="align-self:end">Start countdown</button>
  </div>
  <div class="er" id="cer"></div>
  <div id="cdw"></div>
</section>

<div id="main"></div>
<div id="lb"></div>
<div id="sr"></div>
<div id="lib"></div>
<div id="calc"></div>
<div id="tt"></div>
<div id="tm"></div>
<div id="wk"></div>
<div id="rv"></div>
<div id="at"></div>
<div id="bd"></div>
<div id="rp"></div>
<div id="rm"></div>
<div id="prem"></div>


</div>

<script>
const $=id=>document.getElementById(id);
const P={award:'<path d="m15.477 12.89 1.515 8.526a.5.5 0 0 1-.81.47l-3.58-2.687a1 1 0 0 0-1.197 0l-3.586 2.686a.5.5 0 0 1-.81-.469l1.514-8.526"/><circle cx="12" cy="8" r="6"/>',rocket:'<path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>',book:'<path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>',target:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',play:'<polygon points="6 3 20 12 6 21 6 3"/>',pause:'<rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/>',check:'<path d="M20 6 9 17l-5-5"/>',dl:'<path d="M12 15V3m0 12-4-4m4 4 4-4"/><path d="M2 17l.621 2.485A2 2 0 0 0 4.561 21h14.878a2 2 0 0 0 1.94-1.515L22 17"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2m-7.07-15.07 1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>',moon:'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',flame:'<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',lock:'<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>'};
const ic=k=>`<svg class="i" viewBox="0 0 24 24">${P[k]}</svg>`;
$('logo').innerHTML=ic('flame')+'TrackOven';


// Welcome (messages are set by the admin; one is picked at random)
const MSGS=[['Welcome back','Consistency beats cramming. One focused session today moves you forward.'],['Good to see you','Every score you log shows you where to improve next.'],['Ready to study?','Small daily wins add up to a big result on exam day.'],['Keep going','Your future course is waiting. Show up for it today.']];
const m=MSGS[Math.floor(Math.random()*MSGS.length)];
$('wt').textContent=m[0]+', Aisha';$('wm').textContent=m[1];

// Exams
const mk=(a,mx)=>a.map(n=>({n,max:mx,tg:null}));
const EX={
 'UTME':{subs:mk(['Use of English','Mathematics','Physics','Chemistry'],100),total:400,tg:null},
 'UI Post UTME':{subs:mk(['Post UTME score'],100),total:100,tg:null,note:'Use the aggregate calculator below for your final aggregate.'},
 'WAEC':{subs:mk(['English','Mathematics','Physics','Chemistry','Biology'],100),total:null,tg:null},
 'NECO':{subs:mk(['English','Mathematics','Physics','Chemistry','Biology'],100),total:null,tg:null},
 '100L':{subs:[],total:null,tg:null},
 'Custom exam':{subs:[],total:null,tg:null}
};
const POOL=['Biology','Government','Economics','Literature in English','Commerce','Geography','Agricultural Science','Christian Religious Studies','Islamic Studies','Further Mathematics','Accounting','Civic Education','History','Technical Drawing'];
const DATA={};
let cur='UTME',view=-1;
// Exam dates created by the admin (examples)
const ADMIN_EX=[['UTME','2027-04-24T08:00'],['UI Post UTME','2027-07-10T08:00'],['WAEC','2027-05-10T08:00'],['NECO','2027-06-14T08:00']];
let cdSel=localStorage_safe('cd')||'UTME',cdCustom=null;
function localStorage_safe(){return null}

function fmt(d){return new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'})}
function sg(n){return (n>0?'+':'')+n}

// Chips
function chips(){$('chips').innerHTML=Object.keys(EX).map(k=>`<button class="chip ${k===cur?'on':''}" data-k="${k}">${esc2(EX[k].title||k)}</button>`).join('');
 document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{cur=b.dataset.k;view=-1;chips();render();lbLoad();srRender()})}

// Countdown
function cdOptions(){$('cs').innerHTML=ADMIN_EX.map(a=>`<option value="${a[0]}">${a[0]}</option>`).join('')+'<option value="__c">Other exam (enter my own date)</option>';
 $('cs').value=cdSel;$('cust').style.display=cdSel==='__c'?'flex':'none'}
$('cs').onchange=()=>{cdSel=$('cs').value;$('cer').textContent='';cdOptions();tick();dbCountdown()};
$('csave').onclick=()=>{const n=$('cn').value.trim(),t=$('cdt').value;
 if(!n||!t){$('cer').textContent='Enter the exam name and its date and time.';return}
 if(new Date(t)<=new Date()){$('cer').textContent='Pick a date in the future.';return}
 $('cer').textContent='';cdCustom={n,t};tick();dbCountdown()};
function parts(t){const now=new Date();if(t<=now)return null;
 let mo=(t.getFullYear()-now.getFullYear())*12+t.getMonth()-now.getMonth();
 let a=new Date(now);a.setMonth(now.getMonth()+mo);if(a>t){mo--;a=new Date(now);a.setMonth(now.getMonth()+mo)}
 let r=t-a;const d=Math.floor(r/864e5);r-=d*864e5;const h=Math.floor(r/36e5);r-=h*36e5;const mi=Math.floor(r/6e4);r-=mi*6e4;
 return [mo,Math.floor(d/7),d%7,h,mi,Math.floor(r/1e3)]}
function tick(){
 let name,t;
 if(cdSel==='__c'){if(!cdCustom){$('cdw').innerHTML='<div class="sub">Enter your exam details to start the countdown.</div>';return}name=cdCustom.n;t=new Date(cdCustom.t)}
 else{const a=ADMIN_EX.find(x=>x[0]===cdSel);name=a[0];t=new Date(a[1])}
 const p=parts(t),L=['Months','Weeks','Days','Hours','Mins','Secs'];
 $('cdw').innerHTML=`<div class="sub">${name} · ${t.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}</div>`+(p?`<div class="cd">${p.map((v,i)=>`<div><b>${String(v).padStart(2,'0')}</b><span>${L[i]}</span></div>`).join('')}</div>`:'<div class="pill" style="margin-top:8px">Exam time. Good luck!</div>')}
setInterval(tick,1000);

// Main
const exTotal=ex=>ex.total||ex.subs.reduce((a,x)=>a+x.max,0);
const LSEL=new Set(),LV={},LF={d:null,l:'Mock test'};let LM='',SM='';
function snaps(es){const sorted=[...es].sort((a,b)=>a.d.localeCompare(b.d)),last={},out=[];
 sorted.forEach((e,i)=>{last[e.s]={v:e.v,mx:e.mx};const nx=sorted[i+1];if(!nx||nx.d!==e.d){let t=0,m=0;Object.values(last).forEach(x=>{t+=x.v;m+=x.mx});out.push({d:e.d,t,m,last:JSON.parse(JSON.stringify(last))})}});return out}
function render(){
 if(!free('tracker')){$('main').innerHTML=gate('tracker');return}
 const ex=EX[cur],es=DATA[cur]||(DATA[cur]=[]),XT=exTotal(ex),sn=snaps(es.filter(e=>ex.subs.some(s=>s.n===e.s))),n=sn.length;
 if(view>=ex.subs.length)view=-1;
 let h='';
 if(n){const L=sn[n-1],pv=n>1?sn[n-2]:null,df=pv?L.t-pv.t:0,lg=Object.keys(L.last).length,p3=sn.slice(Math.max(0,n-4),n-1),avg=p3.length?Math.round(p3.reduce((a,b)=>a+b.t,0)/p3.length):null,tg=ex.tg;
  h+=`<section class="card hero"><div class="ring"><svg width="140" height="140" viewBox="0 0 140 140"><circle cx="70" cy="70" r="60" fill="none" stroke="var(--line)" stroke-width="11"/><circle cx="70" cy="70" r="60" fill="none" stroke="var(--gold)" stroke-width="11" stroke-linecap="round" stroke-dasharray="377" stroke-dashoffset="${377*(1-Math.min(1,L.t/XT))}"/></svg><div class="c"><div class="big">${L.t}</div><div class="sub">out of ${XT}</div></div></div>
  <div><div class="sub" style="margin-bottom:6px">Cumulative score · ${lg}/${ex.subs.length} subjects logged</div><span class="pill ${df>0?'up':df<0?'down':''}">${pv?(df>0?'▲ ':df<0?'▼ ':'● ')+sg(df)+' since last entry':'First entry'}</span>
  <div class="rows">${L.m<XT?`<div><span>Marks so far</span><b>${L.t} / ${L.m}</b></div>`:''}${avg!==null?`<div><span>vs. average of previous 3</span><b style="color:${L.t-avg>=0?'var(--up)':'var(--down)'}">${L.t-avg>=0?'▲':'▼'} ${sg(L.t-avg)}</b></div>`:''}${tg?`<div><span>Overall target</span><b>${tg}</b></div><div><span>Gap to target</span><b>${L.t>=tg?'Reached':tg-L.t+' points'}</b></div>`:''}</div></div></section>
  <section class="card chart"><h3>Progress over time</h3><div class="chips cw" id="tb">${['Total',...ex.subs.map(x=>x.n)].map((x,i)=>`<button class="chip ${view===i-1?'on':''}" data-v="${i-1}">${esc2(x)}</button>`).join('')}</div><div id="ch"></div></section>

function serPlan(s){const n=s.to-s.from+1,days=Math.max(1,dayDiff(s.start,s.end)+1),per=Math.ceil(n/days),out=[];
 for(let i=0;i<n;i+=per){const items=[];for(let k=i;k<Math.min(n,i+per);k++)items.push(s.from+k);out.push({day:out.length+1,date:addDays(s.start,out.length),items})}return {per,out}}

 try{

   sb.from('profiles').select('full_name,show_on_leaderboard').eq('id',U.id).maybeSingle(),sb.rpc('my_access'),sb.from('features').select('*'),

   sb.rpc('random_welcome_message'),sb.from('user_exams').select('*'),sb.from('user_subjects').select('*'),

   sb.from('tasks').select('*').order('task_date').limit(5000),sb.from('study_sessions').select('*').order('started_at').limit(2000),
   sb.from('topic_scores').select('*').order('created_at').limit(2000),sb.from('reminder_settings').select('*').maybeSingle(),sb.from('practice_series').select('*').order('created_at'),sb.from('series_scores').select('*'),sb.from('notes').select('*').order('created_at',{ascending:false}),sb.from('note_files').select('*'),sb.from('mistakes').select('*').order('created_at',{ascending:false}),sb.from('recall_attempts').select('*').order('created_at',{ascending:false}).limit(300),sb.from('site_settings').select('value').eq('key','uploads').maybeSingle()]);

  Object.keys(SCH).forEach(k=>delete SCH[k]);L(sch).forEach(x=>SCH[x.name]={u:+x.utme_points,p:+x.post_points,po:+x.post_out_of,o:+x.olevel_points});csch=Object.keys(SCH)[0]||'__o';
  PLANS.length=0;L(pl).forEach(x=>PLANS.push({id:x.id,n:x.name,p:x.price_kobo/100,d:x.days}));selPlan=PLANS.length>1?1:0;
  // exams and subjects (defaults are saved for the student the first time)
  const by={};L(us).forEach(r=>(by[r.exam_key]=by[r.exam_key]||[]).push({n:r.name,max:+r.max_score,tg:r.target==null?null:+r.target}));
  L(ue).forEach(r=>{if(EX[r.exam_key]){EX[r.exam_key].total=r.total_max==null?null:+r.total_max;EX[r.exam_key].title=r.title||null;EX[r.exam_key].tg=r.overall_target==null?null:+r.overall_target}});
