<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TrackOven — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#081029;--navy2:#0E1A3F;--black:#04070F;--gold:#E8B94A;--gold2:#F6D77E;--ink:#fff;--mute:#A9B2CC;--line:rgba(255,255,255,.12);--up:#34D399;--down:#F87171;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:'Sora',system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--navy2),var(--navy) 40%,var(--black));background-color:var(--navy);line-height:1.5}
button,input,select{font:inherit}
.w{max-width:720px;margin:0 auto;padding:16px 16px 70px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.logo{display:flex;gap:8px;align-items:center;font-weight:800;font-size:19px}
.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.logo .i{color:var(--gold)}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--black);display:grid;place-items:center;font-weight:800;font-size:13px}
.card{background:rgba(14,26,63,.7);border:1px solid var(--line);border-radius:24px;padding:20px;margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:16px}
.wel{border-color:rgba(232,185,74,.45)}
.wel b{display:block;font-size:20px;letter-spacing:-.02em;margin-bottom:4px}
.wel span{color:var(--mute);font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.chip{border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:99px;padding:8px 15px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--gold);color:var(--black);border-color:var(--gold)}
.sub{font-size:12px;color:var(--mute)}
.cd{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;text-align:center;margin:10px 0}
.cd div{background:var(--black);border:1px solid var(--line);border-radius:14px;padding:10px 0}
.cd b{display:block;font-size:22px;font-variant-numeric:tabular-nums;color:var(--gold)}
.cd span{font-size:10px;color:var(--mute)}
.row{display:flex;gap:8px;flex-wrap:wrap}
select,input{background:var(--black);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
select:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
label{display:grid;gap:4px;font-size:12px;color:var(--mute);font-weight:600;flex:1;min-width:130px}
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#04070F}
.btn:active{transform:scale(.97)}
.btn.o{background:transparent;color:var(--ink);border:1px solid var(--line)}
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{position:relative;width:140px;height:140px}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.big{font-size:38px;font-weight:800;letter-spacing:-.04em;line-height:1}
.pill{display:inline-block;font-weight:700;font-size:13px;padding:3px 10px;border-radius:99px;background:var(--line)}
.pill.up{background:rgba(52,211,153,.15);color:var(--up)}.pill.down{background:rgba(248,113,113,.15);color:var(--down)}
.rows{display:grid;gap:6px;margin-top:10px;font-size:13px}
.rows div{display:flex;justify-content:space-between}
.sbar{display:grid;grid-template-columns:104px 1fr auto;gap:10px;align-items:center;margin:11px 0;font-size:13px}
.track{height:8px;background:var(--line);border-radius:9px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:9px;transition:width .7s}
.hist{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.hist small{display:block;color:var(--mute)}
.x{background:none;border:0;color:var(--mute);cursor:pointer;padding:4px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--mute);font-size:11px;font-family:inherit}
.lock{display:flex;align-items:center;gap:12px;padding:12px;border:1px dashed var(--line);border-radius:16px;margin-bottom:8px;color:var(--mute);font-size:13px}
.lock .i{color:var(--gold)}
.lock b{display:block;color:var(--ink);font-size:14px}
.er{color:var(--down);font-size:12px;min-height:16px;margin:6px 0}
.badge{font-size:10px;background:var(--gold);color:var(--black);border-radius:99px;padding:2px 8px;font-weight:800;margin-left:6px}
@media(max-width:480px){.hero{grid-template-columns:1fr;justify-items:center}.hero>div:last-child{width:100%}.cd b{font-size:18px}.sbar{grid-template-columns:84px 1fr auto}}
.tgb{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--gold);cursor:pointer;display:grid;place-items:center}.tgb svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.hr{display:flex;gap:10px;align-items:center}
.res{margin-top:12px;padding:14px;border:1px solid var(--gold);border-radius:18px}.res .big{font-size:34px;color:var(--gold)}
:root[data-theme="light"]{--navy:#F3F5FB;--navy2:#E4E9F7;--black:#fff;--ink:#0B1330;--mute:#55607F;--line:rgba(11,19,48,.15);--up:#0E9F6E;--down:#D9362F;--gold:#B7860F;--gold2:#E6BE55}
:root[data-theme="light"] .card{background:rgba(255,255,255,.88)}
.tmd{font-size:54px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;color:var(--gold);margin:14px 0;letter-spacing:-.03em}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.g3>div{border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;background:var(--black)}.g3 b{display:block;font-size:24px;color:var(--gold)}
.ck{display:flex;gap:10px;align-items:flex-start;flex:1;font-size:14px;color:var(--ink);font-weight:500}.ck input{width:20px;height:20px;margin-top:2px;accent-color:var(--gold);flex:none}.ck small{display:block;color:var(--mute);font-size:12px}.ck .ok{color:var(--up)}
.dh{font-size:12px;font-weight:700;color:var(--gold);margin:14px 0 2px}.tb{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.sm{padding:8px 14px;font-size:13px}
#phead{display:none}
.sd{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:middle}
table.tt{table-layout:auto}table.tt td.tm{white-space:nowrap;color:var(--mute);font-size:12px;width:1%}table.tt td.dn{width:1%;text-align:center}
table.tt tr.dr td{background:rgba(232,185,74,.14);color:var(--gold);font-weight:700;font-size:12px;border-bottom:0;padding:7px 8px}
details.sym summary{cursor:pointer;color:var(--gold);font-size:13px;font-weight:600;margin-top:10px}
.symgrid{flex-wrap:wrap;gap:6px;margin-top:8px}.symb{min-width:40px;height:40px;border:1px solid var(--line);background:var(--black);color:var(--ink);border-radius:10px;font-size:18px;cursor:pointer;padding:0 6px}
@media print{
 @page{margin:14mm}
 body{background:#fff!important;color:#14162B!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 #nav,.nop,header,.chips{display:none!important}
 .w>*{display:none!important}
 body[data-pr] .w>#phead,body[data-pr] .w>.pg{display:block!important}
 body[data-pr] .pg>*{display:none!important}
 body[data-pr="tt"] #tt,body[data-pr="rp"] #rp,body[data-pr="sr"] #sr{display:block!important}
 body[data-pr] .w{max-width:none!important;padding:0!important}
 body[data-pr] .w *{color:#14162B!important}

 body[data-pr] .sub{color:#5a6280!important}
 body[data-pr] .ok{color:#0a8f5f!important}
 body[data-pr] table.tt{width:100%;border-collapse:collapse;font-size:13px}

 body[data-pr] table.tt tr:nth-child(even) td{background:#F6F8FD!important}
 body[data-pr] table.tt tr.dr td{background:#FFF1CC!important;color:#8A6200!important;font-weight:700;border-bottom:2px solid #E8B94A!important}
 body[data-pr] table.tt tr{page-break-inside:avoid}
 body[data-pr] .g3>div{background:#F3F5FB!important;border:1px solid #D9DEEE!important;border-radius:10px}

 body[data-pr] .track{background:#E6E9F5!important}
 body[data-pr] .fill{background:#E8B94A!important}
 body[data-pr] .pill{background:#EEF0FF!important}
 body[data-pr] .dh{color:#8A6200!important;border-bottom:1px solid #E8B94A}
 body[data-pr] .ph{background:#0E1A3F!important;padding:18px 20px;border-radius:12px;margin-bottom:14px;border-left:10px solid #E8B94A}
 body[data-pr] .ph .phl{color:#E8B94A!important;font-weight:800;font-size:13px;letter-spacing:.12em}
 body[data-pr] .ph .pht{color:#fff!important;font-size:26px;font-weight:800;margin:2px 0}
 body[data-pr] .ph .phs{color:#C9D0E6!important;font-size:12px}
}
.ov{position:fixed;inset:0;z-index:20;background:rgba(2,5,14,.82);display:none;overflow-y:auto;padding:max(20px,env(safe-area-inset-top,0px)) 16px 24px}.ov.on{display:block}
.pl{border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;background:var(--black);width:100%;text-align:left;color:var(--ink)}.pl.on{border-color:var(--gold)}.pl b{font-size:18px;color:var(--gold)}
.pg{display:none}.pg.on{display:block}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:15;max-width:720px;margin:0 auto;display:flex;background:var(--navy);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border:0;background:transparent;color:var(--mute);font-size:11px;font-weight:600;cursor:pointer}
#nav button svg{width:22px;height:22px}#nav button.on{color:var(--gold)}
.w{padding-bottom:110px}
table.tt{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
table.tt th{text-align:left;font-size:11px;color:var(--mute);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.tt td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
table.tt input[type=checkbox]{width:20px;height:20px;padding:0;accent-color:var(--gold)}
</style>
<script>try{var t=localStorage.getItem("to-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}
const PLANS=[{n:'Monthly',p:1500,d:30},{n:'3 Months',p:4000,d:90},{n:'Yearly',p:12000,d:365}];let selPlan=1,upMsg='';
function up(){let o=$('upm');if(!o){o=document.createElement('div');o.className='ov';o.id='upm';document.body.appendChild(o)}
 const pr=FEATS.filter(f=>!f.free);
 o.innerHTML=`<div class="card" style="max-width:440px;margin:20px auto;position:relative"><button class="x" id="upx" aria-label="Close" style="position:absolute;top:12px;right:14px">${ic('x')}</button><h3 style="font-size:20px">Upgrade to Premium</h3><div class="sub" style="margin-bottom:12px">Unlock:</div>${pr.map(f=>`<div style="display:flex;gap:8px;align-items:center;font-size:14px;margin:6px 0"><span style="color:var(--gold)">${ic('check')}</span>${f.n}</div>`).join('')||'<div class="sub">Everything is already free right now.</div>'}<div style="margin-top:14px">${PLANS.map((p,i)=>`<button class="pl ${i===selPlan?'on':''}" data-pl="${i}"><span>${p.n}<span class="sub" style="display:block">${p.d} days</span></span><b>₦${p.p.toLocaleString()}</b></button>`).join('')}</div>${PLANS[selPlan]?`<button class="btn" id="upg" style="width:100%">Pay ₦${PLANS[selPlan].p.toLocaleString()} with Paystack</button>`:'<div class="sub">No plans are available yet.</div>'}${(()=>{try{return localStorage.getItem('to-ref')}catch(e){return null}})()?'<button class="btn o sm" id="upchk" style="margin-top:8px;width:100%">I have paid, check my payment</button>':''}<div class="er ${upMsg?'ok':''}" style="margin-top:10px">${upMsg}</div><div class="sub">You pay securely on Paystack. Premium unlocks as soon as the payment is confirmed, even if you close the page.</div></div>`;
 if(!(history.state&&history.state.m))history.pushState({m:1,pg:PAGE},'');o.classList.add('on');$('upx').onclick=()=>{if(history.state&&history.state.m)history.back();else{o.classList.remove('on');upMsg=''}};
 o.querySelectorAll('[data-pl]').forEach(b=>b.onclick=()=>{selPlan=+b.dataset.pl;upMsg='';up()});
 if($('upg'))$('upg').onclick=async()=>{const p=PLANS[selPlan];if(!p||!p.id){upMsg='Choose a plan.';return up()}
  $('upg').disabled=true;$('upg').textContent='Opening Paystack...';
  const r=await sb.functions.invoke('paystack-init',{body:{plan_id:p.id}});
  if(r.error||!r.data||!r.data.authorization_url){upMsg=(r.data&&r.data.error)||(r.error?await fnErr(r):'Could not start the payment.');return up()}
  try{localStorage.setItem('to-ref',r.data.reference)}catch(e){}
  location.href=r.data.authorization_url};
 if($('upchk'))$('upchk').onclick=async()=>{let ref=null;try{ref=localStorage.getItem('to-ref')}catch(e){}if(ref)await payCheck(ref,false)}}
const fnErr=async r=>{try{const j=await r.error.context.json();return j.error||r.error.message}catch(e){return r.error.message}};
async function payCheck(ref,quiet){
 const r=await sb.functions.invoke('paystack-verify',{body:{reference:ref}});
 if(r.error){const m=await fnErr(r);if(!quiet)toast(m);return false}
 const st=r.data&&r.data.status;
 if(st==='ok'||st==='already'){try{localStorage.removeItem('to-ref')}catch(e){}toast('Premium unlocked. Thank you!',true);setTimeout(()=>location.replace('app.html'),1500);return true}
 if(!quiet)toast('Payment not confirmed yet. If you were charged, Premium unlocks within a minute. Tap Check my payment later.');return false}
function payReturn(){let ref=null;try{ref=new URLSearchParams(location.search).get('paid')}catch(e){}
 if(ref){history.replaceState(null,'','app.html');payCheck(ref,false)}}

</script>

<script>
const $=id=>document.getElementById(id);
const P={user:'<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',home:'<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',cal:'<path d="M8 2v4M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>',grid:'<rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/>',award:'<path d="m15.477 12.89 1.515 8.526a.5.5 0 0 1-.81.47l-3.58-2.687a1 1 0 0 0-1.197 0l-3.586 2.686a.5.5 0 0 1-.81-.469l1.514-8.526"/><circle cx="12" cy="8" r="6"/>',rocket:'<path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>',book:'<path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>',target:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',play:'<polygon points="6 3 20 12 6 21 6 3"/>',pause:'<rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/>',check:'<path d="M20 6 9 17l-5-5"/>',dl:'<path d="M12 15V3m0 12-4-4m4 4 4-4"/><path d="M2 17l.621 2.485A2 2 0 0 0 4.561 21h14.878a2 2 0 0 0 1.94-1.515L22 17"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2m-7.07-15.07 1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>',moon:'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',flame:'<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',lock:'<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>'};
const ic=k=>`<svg class="i" viewBox="0 0 24 24">${P[k]}</svg>`;
$('logo').innerHTML=ic('flame')+'TrackOven';


// Welcome (messages are set by the admin; one is picked at random)
const MSGS=[['Welcome back','Consistency beats cramming. One focused session today moves you forward.'],['Good to see you','Every score you log shows you where to improve next.'],['Ready to study?','Small daily wins add up to a big result on exam day.'],['Keep going','Your future course is waiting. Show up for it today.']];
const m=MSGS[Math.floor(Math.random()*MSGS.length)];
$('wt').textContent=m[0]+', Aisha';$('wm').textContent=m[1];

// Exams

 const subs=[...AT.sel],len=AT.len,total=Math.floor(AT.h*60/len);
 if(total<1)return {err:'Your hours per day are shorter than one session. Add hours or shorten the session.'};
 const need={};subs.forEach(x=>{if(AT.sh[x]>0)need[x]=Math.max(1,Math.round(AT.sh[x]*60/len))});
 const fixedSum=Object.values(need).reduce((a,b)=>a+b,0);
 if(fixedSum>total)return {err:'The hours you set for single subjects add up to more than your hours per day.'};
 const flex=subs.filter(x=>!need[x]),wt=x=>AT.weak.has(x)?2:AT.strong.has(x)?0.5:1,W=flex.reduce((a,x)=>a+wt(x),0)||1,credit={};flex.forEach(x=>credit[x]=0);
 const start=AT.start==='c'?tmin(AT.custom):tmin(AT.start),plan=[];let sessions=0;
 for(let d=0;d<AT.days;d++){
  const counts={...need};
  if(flex.length)for(let k=0;k<total-fixedSum;k++){flex.forEach(x=>credit[x]+=wt(x)/W);const p=flex.slice().sort((a,b)=>credit[b]-credit[a])[0];credit[p]-=1;counts[p]=(counts[p]||0)+1}
  const seq=[];let last=null;const rest={...counts};
  while(Object.values(rest).some(v=>v>0)){const c=Object.keys(rest).filter(k=>rest[k]>0).sort((a,b)=>rest[b]-rest[a]);const pick=c.find(k=>k!==last)||c[0];seq.push(pick);rest[pick]--;last=pick}
  let t=start;const date=addDays(AT.date,d);
  for(let i=0;i<seq.length;i++){
   if(t+len>1439)break;
   plan.push({d:date,s:hm(t),e:hm(t+len),sub:seq[i]});sessions++;t+=len;
   if(i<seq.length-1){const b=(AT.lbrk>0&&(i+1)%AT.lbn===0)?AT.lbrk:AT.brk;if(b>0&&t+b+len<=1439){plan.push({d:date,s:hm(t),e:hm(t+b),sub:'Break',brk:true});t+=b}}}}

 if(sessions>1200)return {err:'That is too many sessions at once. Use fewer days or fewer hours per day.'};
 return {plan}}

function toast(m,ok){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;background:#D9362F;color:#fff;padding:10px 16px;border-radius:14px;font-size:13px;max-width:90%';document.body.appendChild(t)}t.textContent=m;t.style.background=ok?'#0E9F6E':'#D9362F';t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',5000)}
async function q(p){const r=await p;if(r.error)toast(r.error.message);return r}
const touch=()=>sb.rpc('touch_activity');

const dbDelEntry=id=>q(sb.from('score_entries').delete().eq('id',id));
async function dbAddTasks(rows,src){const r=await q(sb.from('tasks').insert(rows.map(t=>({task_date:t.d,start_time:t.s,end_time:t.e,subject:t.sub,topic:t.top||null,description:t.desc||null,source:src||'manual'}))).select('id'));if(r.error||!r.data)return false;r.data.forEach((x,i)=>{rows[i].id=x.id;rows[i].src=src||'manual'});return true}
const dbTask=(t,patch)=>{touch();return q(sb.from('tasks').update(patch).eq('id',t.id))};
const dbDelTask=id=>q(sb.from('tasks').delete().eq('id',id));
const dbSession=x=>{touch();return q(sb.from('study_sessions').insert({subject:x.sub,topic:x.top||null,seconds:x.sec,started_at:new Date(x.at).toISOString()}))};
async function dbAddTopics(rows){const r=await q(sb.from('topic_scores').insert(rows.map(t=>({subject:t.s,topic:t.t,score:t.p}))).select('id'));if(r.error||!r.data)return false;r.data.forEach((x,i)=>rows[i].id=x.id);return true}
const dbDelTopic=id=>q(sb.from('topic_scores').delete().eq('id',id));
const dbTopicSch=id=>q(sb.from('topic_scores').update({revision_scheduled:true}).eq('id',id));
const dbRem=()=>q(sb.from('reminder_settings').upsert({user_id:U.id,push_enabled:REM.push,email_enabled:REM.email,lead_minutes:REM.lead,morning_time:REM.morning,evening_time:REM.evening,inactivity_days:REM.inact},{onConflict:'user_id'}));
function dbCountdown(){const c=cdSel==='__c'?{user_id:U.id,catalog_exam_id:null,custom_name:cdCustom?cdCustom.n:null,custom_at:cdCustom?new Date(cdCustom.t).toISOString():null}:{user_id:U.id,catalog_exam_id:(CAT.find(x=>x.name===cdSel)||{}).id||null,custom_name:null,custom_at:null};return q(sb.from('user_countdown').upsert(c,{onConflict:'user_id'}))}
async function claimStored(){let c=null;try{c=localStorage.getItem('to-claim')}catch(e){}if(!c)return;
 const r=await sb.rpc('claim_mock_results',{p_code:c});try{localStorage.removeItem('to-claim')}catch(e){}
 if(r.error){toast(r.error.message);return}
 const n=(r.data&&r.data.claimed)||0;toast(n?n+' mock'+(n>1?'s':'')+' added from the mock site. Refreshing...':'No mock results were waiting for that code.',!!n);if(n)setTimeout(()=>location.reload(),1800)}
async function init(){
 try{
  {const ss0=(await sb.auth.getSession()).data.session;U.id=ss0.user.id;U.email=ss0.user.email}
  const R=await Promise.all([
   sb.from('profiles').select('full_name,show_on_leaderboard,phone,institution,course').eq('id',U.id).maybeSingle(),sb.rpc('my_access'),sb.from('features').select('*'),
   sb.from('exams_catalog').select('*').order('exam_at'),sb.from('schools').select('*').order('name'),sb.from('plans').select('*').order('days'),
   sb.rpc('random_welcome_message'),sb.from('user_exams').select('*'),sb.from('user_subjects').select('*'),
   sb.from('score_entries').select('*').order('taken_on').limit(5000),sb.from('user_countdown').select('*').maybeSingle(),
   sb.from('tasks').select('*').order('task_date').limit(5000),sb.from('study_sessions').select('*').order('started_at').limit(2000),
   sb.from('topic_scores').select('*').order('created_at').limit(2000),sb.from('reminder_settings').select('*').maybeSingle(),sb.from('practice_series').select('*').order('created_at'),sb.from('series_scores').select('*'),sb.from('notes').select('*').order('created_at',{ascending:false}),sb.from('note_files').select('*'),sb.from('mistakes').select('*').order('created_at',{ascending:false}),sb.from('recall_attempts').select('*').order('created_at',{ascending:false}).limit(300),sb.from('site_settings').select('value').eq('key','uploads').maybeSingle(),sb.from('syllabus_items').select('*').limit(5000),sb.from('syllabus_catalog').select('*').limit(5000),sb.from('mock_accounts').select('mock_user_ref'),sb.from('site_settings').select('value').eq('key','mocks').maybeSingle(),sb.from('subscriptions').select('ends_at').eq('status','success').gt('ends_at',new Date().toISOString()).order('ends_at',{ascending:false}).limit(1).maybeSingle()]);
  R.forEach(r=>{if(r.error)toast(r.error.message)});
  const [prof,acc,feat,cat,sch,pl,wm,ue,us,se,cd,tk,ss,ts,rm,ps,pss,nts,nfs,mks,rca,upl,syi,syc,mka,mset,sub]=R,L=r=>r.data||[];
  const first=((prof.data&&prof.data.full_name)||'').split(' ')[0],w=L(wm)[0];LB.me=!!(prof.data&&prof.data.show_on_leaderboard);
  $('wt').textContent=(w?w.title:'Welcome')+(first?', '+first:'');if(w)$('wm').textContent=w.body;
  // free / premium access
  const A=acc.data||{};if(L(feat).length){FEATS.length=0;L(feat).sort((a,b)=>a.name.localeCompare(b.name)).forEach(f=>FEATS.push({k:f.key,n:f.name,free:!!A[f.key]}))}
  // catalogs from the admin dashboard
  CAT.length=0;L(cat).forEach(c=>CAT.push(c));ADMIN_EX.length=0;CAT.forEach(c=>ADMIN_EX.push([c.name,c.exam_at]));
  Object.keys(SCH).forEach(k=>delete SCH[k]);L(sch).forEach(x=>SCH[x.name]={u:+x.utme_points,p:+x.post_points,po:+x.post_out_of,o:+x.olevel_points});csch=Object.keys(SCH)[0]||'__o';
  PLANS.length=0;L(pl).forEach(x=>PLANS.push({id:x.id,n:x.name,p:x.price_kobo/100,d:x.days}));selPlan=PLANS.length>1?1:0;
  // exams and subjects (defaults are saved for the student the first time)
  const by={};L(us).forEach(r=>(by[r.exam_key]=by[r.exam_key]||[]).push({n:r.name,max:+r.max_score,tg:r.target==null?null:+r.target}));
  L(ue).forEach(r=>{if(EX[r.exam_key]){EX[r.exam_key].total=r.total_max==null?null:+r.total_max;EX[r.exam_key].title=r.title||null;EX[r.exam_key].tg=r.overall_target==null?null:+r.overall_target}});
  Object.keys(EX).forEach(k=>{if(by[k])EX[k].subs=by[k]});
  const haveE=new Set(L(ue).map(r=>r.exam_key)),sE=[],sS=[];
  Object.keys(EX).forEach(k=>{const e=EX[k];if(!haveE.has(k)&&(e.total||e.tg))sE.push({user_id:U.id,exam_key:k,total_max:e.total,overall_target:e.tg});if(!by[k])e.subs.forEach(x=>sS.push({user_id:U.id,exam_key:k,name:x.n,max_score:x.max,target:x.tg}))});
  if(sE.length)await q(sb.from('user_exams').upsert(sE,{onConflict:'user_id,exam_key'}));
  if(sS.length)await q(sb.from('user_subjects').upsert(sS,{onConflict:'user_id,exam_key,name'}));
  // scores, timetable, sessions, topics, reminders
  Object.keys(DATA).forEach(k=>delete DATA[k]);L(se).forEach(r=>(DATA[r.exam_key]=DATA[r.exam_key]||[]).push({id:r.id,d:r.taken_on,s:r.subject,v:+r.score,mx:+r.max_score,l:r.label,ca:new Date(r.created_at).getTime(),ver:!!r.verified}));
  TT=L(tk).map(r=>({id:r.id,d:r.task_date,s:r.start_time.slice(0,5),e:r.end_time.slice(0,5),sub:r.subject,top:r.topic||'',desc:r.description||'',src:r.source,done:r.completed_at?new Date(r.completed_at).getTime():null}));
  SESS.length=0;L(ss).forEach(r=>SESS.push({id:r.id,sub:r.subject,top:r.topic||'',min:Math.max(1,Math.round(r.seconds/60)),sec:r.seconds,at:new Date(r.started_at).getTime()}));
  TOP=L(ts).map(r=>({id:r.id,s:r.subject,t:r.topic,p:+r.score,sch:r.revision_scheduled}));
  if(rm.data){const r=rm.data;Object.assign(REM,{push:r.push_enabled,email:r.email_enabled,lead:r.lead_minutes,morning:r.morning_time.slice(0,5),evening:r.evening_time.slice(0,5),inact:r.inactivity_days})}
  // exam countdown selection
  if(cd.data&&cd.data.catalog_exam_id){const c=CAT.find(x=>x.id===cd.data.catalog_exam_id);cdSel=c?c.name:(ADMIN_EX[0]?ADMIN_EX[0][0]:'__c')}
  else if(cd.data&&cd.data.custom_at){cdSel='__c';cdCustom={n:cd.data.custom_name,t:cd.data.custom_at}}
  else cdSel=ADMIN_EX.length?ADMIN_EX[0][0]:'__c';
  SER=L(ps).map(r=>({id:r.id,name:r.name,exam:r.exam_key,subject:r.subject,from:r.from_n,to:r.to_n,start:r.start_date,end:r.end_date,max:+r.max_score,scores:{}}));L(pss).forEach(r=>{const x=SER.find(y=>y.id===r.series_id);if(x)x.scores[r.item]={score:+r.score,on:r.scored_on}});
  LIB.notes=L(nts).map(r=>({id:r.id,kind:r.kind,subject:r.subject||'',title:r.title,body:r.body||'',points:r.points||[],at:new Date(r.created_at).getTime()}));LIB.files={};L(nfs).forEach(r=>(LIB.files[r.note_id]=LIB.files[r.note_id]||[]).push({id:r.id,path:r.path,name:r.name,mime:r.mime,size:+r.size_bytes}));
  LIB.mist=L(mks).map(r=>({id:r.id,subject:r.subject||'',topic:r.topic||'',question:r.question,correct:r.correct||'',why:r.why||'',reviewed:r.reviewed,options:r.options||[],answer:r.answer||'',chosen:r.chosen||'',at:new Date(r.created_at).getTime()}));LIB.att=L(rca).map(r=>({id:r.id,note:r.note_id,hit:r.points_hit,total:r.points_total,pct:+r.pct,at:new Date(r.created_at).getTime()}));
  if(upl&&upl.data&&upl.data.value)LIB.up={images:upl.data.value.images!==false,pdfs:upl.data.value.pdfs!==false};
  SYL=L(syi).map(r=>({id:r.id,exam:r.exam_key,subject:r.subject,topic:r.topic,status:r.status}));SYC=L(syc).map(r=>({exam:r.exam_key,subject:r.subject,topic:r.topic}));PF.links=L(mka).length;MOCKS_ON=!!(mset&&mset.data&&mset.data.value&&mset.data.value.enabled);PF.prem=(sub&&sub.data&&sub.data.ends_at)||null;
  if(prof.data){PF.name=prof.data.full_name||'';PF.phone=prof.data.phone||'';PF.institution=prof.data.institution||'';PF.course=prof.data.course||''}
  touch();
 }catch(e){toast('Could not load your data: '+e.message)}
}
